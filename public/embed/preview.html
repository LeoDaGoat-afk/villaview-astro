<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Villa VIEW embed preview</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .preview-banner { background: #ffcc00; color: #333; padding: 8px 16px; font-size: 12px; text-align: center; position: sticky; top: 0; z-index: 1000; }
    .preview-banner code { background: rgba(0,0,0,.08); padding: 2px 6px; border-radius: 2px; }
    .preview-banner select { margin-left: 8px; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="preview-banner">
    PREVIEW MODE — this is what the booking page will look like end-to-end with the embed loaded.
    Language:
    <select onchange="window.location.search = '?lang=' + this.value">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">简体中文</option>
    </select>
  </div>

  <!-- Force local CSS (real embed JS fetches CSS from villaokinawa.com) -->
  <link rel="stylesheet" href="/embed/beds24-custom.css">
  <!-- Load our embed exactly as Beds24 would -->
  <script src="/embed/beds24-body-top.js"></script>
</body>
</html>
